<!DOCTYPE html>
<html lang="fa" dir="ltr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced Dynamic Project Tracker</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <!-- React و ReactDOM از طریق cdnjs بدون خطای CORS -->
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js"></script>
    <script crossorigin src="https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js"></script>
    <!-- Babel -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.5/babel.min.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans">
    <div id="root"></div>

    <script type="text/babel">
        function App() {
            const [projects, setProjects] = React.useState(() => {
                const saved = localStorage.getItem('tracker_projects_v3');
                if (saved) return JSON.parse(saved);
                return [
                    {
                        id: 1,
                        name: 'Davilo Web Platform',
                        logo: '🚀',
                        team: ['Mahya', 'Hadi', 'Mohsen', 'Soltani'],
                        services: [
                            {
                                id: 101,
                                title: 'Gateway Integration',
                                description: 'Connecting secure payment gateways and API routing.',
                                status: 'Stopped',
                                deadline: '2026-11-15',
                                forecastDate: '2026-11-25',
                                reason: 'EMP probe server connectivity issue in datacenter',
                                assignee: 'Hadi'
                            }
                        ]
                    }
                ];
            });

            const [selectedProjectId, setSelectedProjectId] = React.useState(projects[0]?.id || null);
            const [activeTab, setActiveTab] = React.useState('tracker');
            
            const [isAddProjectOpen, setIsAddProjectOpen] = React.useState(false);
            const [isAddServiceOpen, setIsAddServiceOpen] = React.useState(false);
            const [editingService, setEditingService] = React.useState(null);

            const [newProjName, setNewProjName] = React.useState('');
            const [newProjLogo, setNewProjLogo] = React.useState('📌');

            const [servTitle, setServTitle] = React.useState('');
            const [servDesc, setServDesc] = React.useState('');
            const [servStatus, setServStatus] = React.useState('In Progress');
            const [servDeadline, setServDeadline] = React.useState('');
            const [servForecast, setServForecast] = React.useState('');
            const [servReason, setServReason] = React.useState('');
            const [servAssignee, setServAssignee] = React.useState('');

            React.useEffect(() => {
                localStorage.setItem('tracker_projects_v3', JSON.stringify(projects));
            }, [projects]);

            const currentProject = projects.find(p => p.id === selectedProjectId) || projects[0];

            const calculateDelay = (deadline, forecast) => {
                if (!deadline || !forecast) return 0;
                const dDate = new Date(deadline);
                const fDate = new Date(forecast);
                const diffTime = fDate - dDate;
                const diffDays = Math.ceil(diffTime / (1000 * 60 * 60 * 24));
                return diffDays > 0 ? diffDays : 0;
            };

            const getFlashlight = (service) => {
                const delay = calculateDelay(service.deadline, service.forecastDate);
                if (service.status === 'Stopped' || delay > 5) {
                    return { color: 'bg-red-500 animate-pulse', label: 'Critical / Delayed' };
                } else if (delay > 0 || service.status === 'Warning') {
                    return { color: 'bg-yellow-400', label: 'Warning / At Risk' };
                } else {
                    return { color: 'bg-green-500', label: 'On Track' };
                }
            };

            const handleAddProject = (e) => {
                e.preventDefault();
                if (!newProjName) return;
                const newProj = {
                    id: Date.now(),
                    name: newProjName,
                    logo: newProjLogo,
                    team: ['Mahya', 'Team Member'],
                    services: []
                };
                setProjects([...projects, newProj]);
                setSelectedProjectId(newProj.id);
                setNewProjName('');
                setIsAddProjectOpen(false);
            };

            const handleSaveService = (e) => {
                e.preventDefault();
                if (!servTitle) return;

                const serviceData = {
                    id: editingService ? editingService.id : Date.now(),
                    title: servTitle,
                    description: servDesc,
                    status: servStatus,
                    deadline: servDeadline,
                    forecastDate: servForecast,
                    reason: servReason,
                    assignee: servAssignee || 'Team'
                };

                const updatedProjects = projects.map(proj => {
                    if (proj.id === currentProject.id) {
                        let updatedServices = [...proj.services];
                        if (editingService) {
                            updatedServices = updatedServices.map(s => s.id === editingService.id ? serviceData : s);
                        } else {
                            updatedServices.push(serviceData);
                        }
                        return { ...proj, services: updatedServices };
                    }
                    return proj;
                });

                setProjects(updatedProjects);
                closeServiceModal();
            };

            const openEditModal = (service) => {
                setEditingService(service);
                setServTitle(service.title);
                setServDesc(service.description);
                setServStatus(service.status);
                setServDeadline(service.deadline);
                setServForecast(service.forecastDate);
                setServReason(service.reason);
                setServAssignee(service.assignee);
                setIsAddServiceOpen(true);
            };

            const closeServiceModal = () => {
                setEditingService(null);
                setServTitle('');
                setServDesc('');
                setServStatus('In Progress');
                setServDeadline('');
                setServForecast('');
                setServReason('');
                setServAssignee('');
                setIsAddServiceOpen(false);
            };

            const handleDeleteService = (serviceId) => {
                const updatedProjects = projects.map(proj => {
                    if (proj.id === currentProject.id) {
                        return { ...proj, services: proj.services.filter(s => s.id !== serviceId) };
                    }
                    return proj;
                });
                setProjects(updatedProjects);
            };

            return (
                <div className="min-h-screen bg-slate-900 text-slate-100 p-4 md:p-8">
                    <header className="flex flex-col md:flex-row justify-between items-center bg-slate-800 p-4 rounded-2xl shadow-lg border border-slate-700 mb-6 gap-4">
                        <div className="flex items-center gap-3">
                            <span className="text-3xl bg-slate-700 p-2 rounded-xl">{currentProject?.logo || '📊'}</span>
                            <div>
                                <h1 className="text-xl font-bold text-white flex items-center gap-2">
                                    {currentProject?.name}
                                    <span className="text-xs bg-indigo-600 px-2 py-0.5 rounded-full text-indigo-100">Standalone Tracker</span>
                                </h1>
                                <p className="text-xs text-slate-400">Component-Based Dynamic Service Tracker</p>
                            </div>
                        </div>

                        <div className="flex flex-wrap items-center gap-3">
                            <select 
                                value={selectedProjectId} 
                                onChange={(e) => setSelectedProjectId(Number(e.target.value))}
                                className="bg-slate-700 text-white text-sm px-3 py-2 rounded-xl border border-slate-600 focus:outline-none"
                            >
                                {projects.map(p => (
                                    <option key={p.id} value={p.id}>{p.logo} {p.name}</option>
                                ))}
                            </select>

                            <button 
                                onClick={() => setIsAddProjectOpen(true)}
                                className="bg-slate-700 hover:bg-slate-600 text-sm px-3 py-2 rounded-xl transition text-slate-200"
                            >
                                + Project
                            </button>

                            <div className="flex bg-slate-900 p-1 rounded-xl border border-slate-700">
                                <button 
                                    onClick={() => setActiveTab('tracker')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${activeTab === 'tracker' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Tracker
                                </button>
                                <button 
                                    onClick={() => setActiveTab('presentation')}
                                    className={`px-3 py-1.5 rounded-lg text-xs font-medium transition ${activeTab === 'presentation' ? 'bg-indigo-600 text-white' : 'text-slate-400 hover:text-white'}`}
                                >
                                    Presentation View
                                </button>
                            </div>
                        </div>
                    </header>

                    {activeTab === 'tracker' ? (
                        <main>
                            <div className="flex justify-between items-center mb-4">
                                <h2 className="text-lg font-semibold text-indigo-300">Services Pipeline & Status</h2>
                                <button 
                                    onClick={() => { setEditingService(null); setIsAddServiceOpen(true); }}
                                    className="bg-indigo-600 hover:bg-indigo-500 text-white text-sm px-4 py-2 rounded-xl transition shadow-md"
                                >
                                    + Add Service / Task
                                </button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
                                {currentProject?.services.map(service => {
                                    const delayDays = calculateDelay(service.deadline, service.forecastDate);
                                    const flashlight = getFlashlight(service);

                                    return (
                                        <div key={service.id} className="bg-slate-800 border border-slate-700 rounded-2xl p-5 shadow-xl flex flex-col justify-between">
                                            <div>
                                                <div className="flex justify-between items-start gap-2 mb-3">
                                                    <div>
                                                        <span className="text-xs text-indigo-400 font-semibold uppercase">{service.assignee}</span>
                                                        <h3 className="text-base font-bold text-white mt-0.5">{service.title}</h3>
                                                    </div>
                                                    <div className="flex items-center gap-1.5 bg-slate-900 px-2.5 py-1 rounded-full border border-slate-700">
                                                        <span className={`w-3 h-3 rounded-full ${flashlight.color}`}></span>
                                                        <span className="text-[10px] text-slate-300">{delayDays > 0 ? `+${delayDays}d Delay` : 'On Time'}</span>
                                                    </div>
                                                </div>

                                                <p className="text-xs text-slate-300 bg-slate-900/50 p-3 rounded-xl border border-slate-800 mb-4">
                                                    {service.description}
                                                </p>

                                                <div className="space-y-2 text-xs text-slate-400 mb-4">
                                                    <div className="flex justify-between">
                                                        <span>Original Deadline:</span>
                                                        <span className="text-slate-200">{service.deadline || 'Not set'}</span>
                                                    </div>
                                                    <div className="flex justify-between">
                                                        <span>Forecast Resolution:</span>
                                                        <span className="text-amber-400">{service.forecastDate || 'Not set'}</span>
                                                    </div>
                                                    {service.reason && (
                                                        <div className="mt-2 p-2.5 bg-red-950/30 border border-red-900/50 rounded-lg">
                                                            <span className="text-red-400 font-semibold block mb-0.5">Stop Reason / Comment:</span>
                                                            <p className="text-slate-300 italic">{service.reason}</p>
                                                        </div>
                                                    )}
                                                </div>
                                            </div>

                                            <div className="flex justify-end gap-2 pt-3 border-t border-slate-700">
                                                <button onClick={() => openEditModal(service)} className="p-2 hover:bg-slate-700 rounded-lg text-slate-300 text-xs">Edit</button>
                                                <button onClick={() => handleDeleteService(service.id)} className="p-2 hover:bg-red-900/30 rounded-lg text-red-400 text-xs">Delete</button>
                                            </div>
                                        </div>
                                    );
                                })}

                                {currentProject?.services.length === 0 && (
                                    <div className="col-span-full text-center py-12 bg-slate-800/50 border border-slate-700 rounded-2xl">
                                        <p className="text-slate-400 text-sm">No services added yet.</p>
                                    </div>
                                )}
                            </div>
                        </main>
                    ) : (
                        <main className="bg-slate-800 border border-slate-700 rounded-2xl p-6 shadow-2xl">
                            <div className="flex justify-between items-center mb-6 pb-4 border-b border-slate-700">
                                <h2 className="text-xl font-bold text-white">{currentProject.logo} Presentation Summary: {currentProject.name}</h2>
                                <button onClick={() => window.print()} className="bg-slate-700 hover:bg-slate-600 text-white text-xs px-4 py-2 rounded-xl">Print / Export</button>
                            </div>

                            <div className="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
                                    <span className="text-xs text-slate-400">Total Services</span>
                                    <p className="text-2xl font-bold text-indigo-400 mt-1">{currentProject.services.length}</p>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
                                    <span className="text-xs text-slate-400">Active Delays & Issues</span>
                                    <p className="text-2xl font-bold text-red-400 mt-1">{currentProject.services.filter(s => calculateDelay(s.deadline, s.forecastDate) > 0 || s.status === 'Stopped').length}</p>
                                </div>
                                <div className="bg-slate-900 p-4 rounded-xl border border-slate-700 text-center">
                                    <span className="text-xs text-slate-400">Team Size</span>
                                    <p className="text-2xl font-bold text-green-400 mt-1">{currentProject.team.length}</p>
                                </div>
                            </div>

                            <table className="w-full text-left text-xs text-slate-300">
                                <thead className="bg-slate-900 text-slate-400 uppercase">
                                    <tr>
                                        <th className="p-3">Service</th>
                                        <th className="p-3">Assignee</th>
                                        <th className="p-3">Status</th>
                                        <th className="p-3">Deadline vs Forecast</th>
                                        <th className="p-3">Calculated Delay</th>
                                        <th className="p-3">Stop Reason</th>
                                    </tr>
                                </thead>
                                <tbody className="divide-y divide-slate-700">
